gemini-config.apikey=test-api-key

# Model & Generation Options
gemini-config.model=gemini-2.5-flash
gemini-config.temperature=0.2
gemini-config.maxOutputTokens=2048
gemini-config.thinkingBudget=1024

# Prompts
gemini-config.systemPrompt=You are an expert technical recruiter and HR specialist evaluating job applications. Evaluate the candidate's attached CV and applicant message against the job listing title and description. Provide a fair, objective score between 0 and 100 and a concise review summary (maximum 2000 characters).
gemini-config.userPrompt=Job Title: {jobTitle}\nJob Description:\n{jobDescription}\n\nApplicant Message:\n{applicantMessage}\n\nPlease evaluate the attached CV and applicant message for this job listing.

# Scheduled Job & ShedLock
gemini-config.reviewJobCron=-
gemini-config.reviewJobLockAtMostFor=PT1M
gemini-config.reviewJobLockAtLeastFor=PT0S
gemini-config.batchSize=3

# Resilience4j RateLimiter
gemini-config.rateLimiterLimitForPeriod=50
gemini-config.rateLimiterLimitRefreshPeriod=PT0.05S
gemini-config.rateLimiterTimeoutDuration=PT0S

# Resilience4j Retry
gemini-config.retryMaxAttempts=3
gemini-config.retryWaitDuration=PT0.05S

# Resilience4j CircuitBreaker
gemini-config.circuitBreakerFailureRateThreshold=50.0
gemini-config.circuitBreakerSlidingWindowSize=4
gemini-config.circuitBreakerMinimumNumberOfCalls=3
gemini-config.circuitBreakerWaitDurationInOpenState=PT30S
gemini-config.circuitBreakerPermittedNumberOfCallsInHalfOpenState=1
