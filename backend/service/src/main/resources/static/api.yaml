components:
  schemas:
    CurrentUserResponse:
      type: object
      required:
        - firstName
        - lastName
        - email
        - phoneNumber
      properties:
        firstName:
          type: string
          title: First name
          description: First name of the authenticated user
          example: John
          maxLength: 60
        lastName:
          type: string
          title: Last name
          description: Last name of the authenticated user
          example: Doe
          maxLength: 60
        email:
          type: string
          format: email
          title: Email address
          description: Email address of the authenticated user
          example: john.doe@example.com
          maxLength: 255
        phoneNumber:
          type: string
          title: Phone number
          description: Phone number of the authenticated user
          example: "+36301234567"
          maxLength: 15
    PagedUserResponse:
      type: object
      required:
        - content
        - page
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page:
          $ref: '#/components/schemas/PageResponse'
    UserResponse:
      type: object
      required:
        - id
        - firstName
        - lastName
        - email
      properties:
        id:
          type: string
          title: Unique identifier of the user
          description: Unique identifier of the user
          example: test-user
          readOnly: true
        firstName:
          type: string
          title: First name
          description: First name of the user
          example: John
          maxLength: 60
        lastName:
          type: string
          title: Last name
          description: Last name of the user
          example: Doe
