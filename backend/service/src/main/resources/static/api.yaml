openapi: 3.0.0
info:
  title: Applicant Tracking System API Specification
  version: 1.0.0
servers:
  - url: https://ats.robottx.hu/api/v1
tags:
  - name: users
    description: Endpoints for fetching, saving and updating users
  - name: companies
    description: Endpoints for fetching, saving, updating and deleting companies
  - name: employees
    description: Endpoints for managing company employees
  - name: job-listings
    description: Endpoints for managing job listings
  - name: email-templates
    description: Endpoints for managing company email templates
paths:
  /users/me:
    get:
      tags:
        - users
      operationId: getCurrentUser
      summary: Get current authenticated user
      description: Returns the current user's information read from the JWT token provided for authentication
      x-operation-extra-annotation: "@hu.robottx.ats.security.annotation.HasUserAccess"
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Unauthorized
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /companies:
    get:
      tags:
        - companies
      operationId: getCompanies
      summary: Search and list companies
      description: Returns a paginated list of companies filtered and sorted using RSQL
      x-operation-extra-annotation: "@hu.robottx.ats.security.annotation.HasUserAccess"
      parameters:
        - in: query
          name: searchAndPageRequest
          schema:
            $ref: '#/components/schemas/SearchAndPageRequest'
          style: form
          explode: true
          required: false
        - in: query
          name: isEmployee
          required: false
          schema:
            type: boolean
          description: >
            Filter companies by the current user's employee membership status.
            If true, returns only companies where the user is an employee.
            If false, returns only companies where the user is NOT an employee.
            If omitted, returns all companies regardless of membership status (unless role is specified).
        - in: query
          name: role
          required: false
          schema:
            $ref: '#/components/schemas/CompanyRole'
          description: >
            Filter companies by the current user's specific role in the company.
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedCompanyResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - companies
      operationId: saveCompany
      summary: Create a new company
      description: Creates a new company and assigns the authenticated user as its owner
      x-operation-extra-annotation: "@hu.robottx.ats.security.annotation.HasUserAccess"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanySaveRequest'
      responses:
        '201':
          description: Successful Operation
          headers:
            Location:
              schema:
                type: string
                example: /companies/1
              description: Location for the newly created resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /companies/{companyId}:
    get:
      tags:
        - companies
      operationId: getCompany
      summary: Get company by ID
      description: Returns a company by its unique identifier
      x-operation-extra-annotation: "@hu.robottx.ats.security.annotation.HasUserAccess"
      parameters:
        - in: path
          name: companyId
          description: ID of the company
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - companies
      operationId: updateCompany
      summary: Update company
      description: Updates a company by its ID if the authenticated user is its owner or co-owner
      x-operation-extra-annotation: "@hu.robottx.ats.security.annotation.HasUserAccess"
      parameters:
        - in: path
          name: companyId
          description: ID of the company
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyUpdateRequest'
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - companies
      operationId: deleteCompany
      summary: Delete company
      description: Deletes a company by its ID if the authenticated user is its owner
      x-operation-extra-annotation: "@hu.robottx.ats.security.annotation.HasUserAccess"
      parameters:
        - in: path
          name: companyId
          description: ID of the company
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Successful Operation
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /companies/{companyId}/employees:
    get:
      tags:
        - employees
      operationId: getEmployees
      summary: Search and list company employees
      description: Returns a paginated list of employees for the specified company, filtered and sorted using RSQL. Accessible by employees of the company.
      x-operation-extra-annotation: "@hu.robottx.ats.security.annotation.HasUserAccess"
      parameters:
        - in: path
          name: companyId
          description: ID of the company
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: searchAndPageRequest
          schema:
            $ref: '#/components/schemas/SearchAndPageRequest'
          style: form
          explode: true
          required: false
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedEmployeeResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - employees
      operationId: saveEmployee
      summary: Add employee to company
      description: Adds a user to the company in any role excluding OWNER. Accessible by company owners and co-owners.
      x-operation-extra-annotation: "@hu.robottx.ats.security.annotation.HasUserAccess"
      parameters:
        - in: path
          name: companyId
          description: ID of the company
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeSaveRequest'
      responses:
        '201':
          description: Successful Operation
          headers:
            Location:
              schema:
                type: string
                example: /companies/1/employees/2
              description: Location for the newly created resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /companies/{companyId}/employees/{employeeId}:
    get:
      tags:
        - employees
      operationId: getEmployee
      summary: Get employee by ID
      description: Returns an employee by ID within the specified company. Accessible by employees of the company.
      x-operation-extra-annotation: "@hu.robottx.ats.security.annotation.HasUserAccess"
      parameters:
        - in: path
          name: companyId
          description: ID of the company
          required: true
          schema:
            type: integer
            format: int64
        - in: path
          name: employeeId
          description: ID of the employee
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - employees
      operationId: updateEmployee
      summary: Update employee role
      description: Updates an employee's role within the company to any role excluding OWNER. Accessible by company owners and co-owners.
      x-operation-extra-annotation: "@hu.robottx.ats.security.annotation.HasUserAccess"
      parameters:
        - in: path
          name: companyId
          description: ID of the company
          required: true
          schema:
            type: integer
            format: int64
        - in: path
          name: employeeId
          description: ID of the employee
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeUpdateRequest'
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - employees
      operationId: deleteEmployee
      summary: Remove employee from company
      description: Removes an employee from the company. The company owner cannot be removed. Accessible by company owners and co-owners.
      x-operation-extra-annotation: "@hu.robottx.ats.security.annotation.HasUserAccess"
      parameters:
        - in: path
          name: companyId
          description: ID of the company
          required: true
          schema:
            type: integer
            format: int64
        - in: path
          name: employeeId
          description: ID of the employee
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Successful Operation
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /companies/{companyId}/email-templates:
    get:
      tags:
        - email-templates
      operationId: getEmailTemplates
      summary: Search and list company email templates
      description: Returns a paginated list of email templates for the specified company, filtered and sorted using RSQL. Accessible by company owners, co-owners, and HR managers.
      x-operation-extra-annotation: "@hu.robottx.ats.security.annotation.HasUserAccess"
      parameters:
        - in: path
          name: companyId
          description: ID of the company
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: searchAndPageRequest
          schema:
            $ref: '#/components/schemas/SearchAndPageRequest'
          style: form
          explode: true
          required: false
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedEmailTemplateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - email-templates
      operationId: saveEmailTemplate
      summary: Create email template
      description: Creates a new email template for a company. Accessible by company owners, co-owners, and HR managers.
      x-operation-extra-annotation: "@hu.robottx.ats.security.annotation.HasUserAccess"
      parameters:
        - in: path
          name: companyId
          description: ID of the company
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTemplateSaveRequest'
      responses:
        '201':
          description: Successful Operation
          headers:
            Location:
              schema:
                type: string
                example: /companies/1/email-templates/1
              description: Location for the newly created resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTemplateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /companies/{companyId}/email-templates/{emailTemplateId}:
    get:
      tags:
        - email-templates
      operationId: getEmailTemplate
      summary: Get email template by ID
      description: Returns an email template by ID within the specified company. Accessible by company owners, co-owners, and HR managers.
      x-operation-extra-annotation: "@hu.robottx.ats.security.annotation.HasUserAccess"
      parameters:
        - in: path
          name: companyId
          description: ID of the company
          required: true
          schema:
            type: integer
            format: int64
        - in: path
          name: emailTemplateId
          description: ID of the email template
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTemplateResponse'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - email-templates
      operationId: updateEmailTemplate
      summary: Update email template
      description: Updates an email template within the specified company. Accessible by company owners, co-owners, and HR managers.
      x-operation-extra-annotation: "@hu.robottx.ats.security.annotation.HasUserAccess"
      parameters:
        - in: path
          name: companyId
          description: ID of the company
          required: true
          schema:
            type: integer
            format: int64
        - in: path
          name: emailTemplateId
          description: ID of the email template
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTemplateUpdateRequest'
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTemplateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - email-templates
      operationId: deleteEmailTemplate
      summary: Delete email template
      description: Deletes an email template within the specified company. Accessible by company owners, co-owners, and HR managers.
      x-operation-extra-annotation: "@hu.robottx.ats.security.annotation.HasUserAccess"
      parameters:
        - in: path
          name: companyId
          description: ID of the company
          required: true
          schema:
            type: integer
            format: int64
        - in: path
          name: emailTemplateId
          description: ID of the email template
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Successful Operation
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /job-listings:
    get:
      tags:
        - job-listings
      operationId: getJobListings
      summary: Search and list job listings
      description: Returns a paginated list of job listings filtered and sorted using RSQL. Accessible by authenticated users.
      x-operation-extra-annotation: "@hu.robottx.ats.security.annotation.HasUserAccess"
      parameters:
        - in: query
          name: searchAndPageRequest
          schema:
            $ref: '#/components/schemas/SearchAndPageRequest'
          style: form
          explode: true
          required: false
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedJobListingResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - job-listings
      operationId: saveJobListing
      summary: Create a new job listing
      description: Creates a new job listing for a company. Accessible by company owners, co-owners, and HR managers.
      x-operation-extra-annotation: "@hu.robottx.ats.security.annotation.HasUserAccess"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobListingSaveRequest'
      responses:
        '201':
          description: Successful Operation
          headers:
            Location:
              schema:
                type: string
                example: /job-listings/1
              description: Location for the newly created resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListingResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /job-listings/{jobListingId}:
    get:
      tags:
        - job-listings
      operationId: getJobListing
      summary: Get job listing by ID
      description: Returns a job listing by ID. Accessible by authenticated users if published, or by company owners, co-owners, and HR managers if draft or closed.
      x-operation-extra-annotation: "@hu.robottx.ats.security.annotation.HasUserAccess"
      parameters:
        - in: path
          name: jobListingId
          description: ID of the job listing
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListingResponse'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - job-listings
      operationId: updateJobListing
      summary: Update job listing
      description: Updates a job listing by its ID. Accessible by company owners, co-owners, and HR managers.
      x-operation-extra-annotation: "@hu.robottx.ats.security.annotation.HasUserAccess"
      parameters:
        - in: path
          name: jobListingId
          description: ID of the job listing
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobListingUpdateRequest'
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListingResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - job-listings
      operationId: deleteJobListing
      summary: Delete job listing
      description: Deletes a job listing by its ID. Accessible by company owners, co-owners, and HR managers.
      x-operation-extra-annotation: "@hu.robottx.ats.security.annotation.HasUserAccess"
      parameters:
        - in: path
          name: jobListingId
          description: ID of the job listing
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Successful Operation
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    CurrentUserResponse:
      type: object
      required:
        - firstName
        - lastName
        - email
        - phoneNumber
      properties:
        firstName:
          type: string
          title: First name
          description: First name of the authenticated user
          example: John
          maxLength: 60
        lastName:
          type: string
          title: Last name
          description: Last name of the authenticated user
          example: Doe
          maxLength: 60
        email:
          type: string
          format: email
          title: Email address
          description: Email address of the authenticated user
          example: john.doe@example.com
          maxLength: 255
        phoneNumber:
          type: string
          title: Phone number
          description: Phone number of the authenticated user
          example: "+36301234567"
          maxLength: 15
    PagedCompanyResponse:
      type: object
      required:
        - content
        - page
