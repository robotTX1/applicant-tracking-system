# Configuration location
config-directory=config
secret-provider=vault
storage-provider=oci

# Servlet Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=20MB

# Generic properties
spring.application.name=ApplicantTrackingSystem
server.port=8080
spring.threads.virtual.enabled=true

# JPA Properties
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.hikari.auto-commit=false

# Liquibase Properties
spring.liquibase.change-log=classpath:/db/changelog/master.yaml

# API
springdoc.api-docs.enabled=true
springdoc.enable-default-api-docs=false
springdoc.api-docs.path=/api/v1/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.url=/api.yaml
springdoc.swagger-ui.path=${springdoc.api-docs.path}/swagger-ui.html

openapi.applicantTrackingSystemAPISpecification.base-path=

# Actuator
management.server.port=9000

# Logs
logging.level.hu.robottx.ats=DEBUG