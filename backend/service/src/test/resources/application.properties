# Configuration location
config-directory=test-config
secret-provider=local
storage-provider=local

# Servlet Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=20MB

# Generic properties
spring.application.name=ApplicantTrackingSystem
spring.threads.virtual.enabled=true
spring.main.allow-bean-definition-overriding=true

# JPA Properties
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.hikari.auto-commit=false

# Liquibase Properties
spring.liquibase.change-log=classpath:/db/changelog/test-master.yaml

# API
openapi.applicantTrackingSystemAPISpecification.base-path=
