apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-certificate
  labels:
    app: {{ .Release.Name }}
spec:
  secretName: {{ .Values.ingressRoute.tlsSecretName }}
  issuerRef:
    name: letsencrypt-cloudflare-production
    kind: ClusterIssuer
  dnsNames:
    {{- range .Values.certificate.dnsNames }}
    - {{ . }}
    {{- end }}
