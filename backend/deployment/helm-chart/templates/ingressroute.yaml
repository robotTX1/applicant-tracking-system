{{- $path := .Values.ingressRoute.pathPrefix | default .Values.ingressRoute.path -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-ingress-route
  labels:
    app: {{ .Release.Name }}
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    {{- range .Values.ingressRoute.hosts }}
    - match: Host(`{{ . }}`)  && PathPrefix(`{{ $path }}`)
      kind: Rule
      services:
        - name: {{ $.Release.Name }}-service
          port: 8080
    {{- end }}
  tls:
    secretName: {{ .Values.ingressRoute.tlsSecretName }}
