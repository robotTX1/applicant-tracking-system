name: Version bump and tag creation

on:
  push:
    branches:
      - master
    paths:
      - 'backend/service/**'

permissions:
  contents: write

jobs:
  version-bump-and-tag:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'backend/service/pom.xml'

      - name: Release
        uses: qcastel/github-actions-maven-release@v1.12.43
        with:
          git-release-bot-name: "github-actions[bot]"
          git-release-bot-email: "github-actions[bot]@users.noreply.github.com"
          pom-directory: "backend/service"
          maven-args: "-Dmaven.javadoc.skip=true -DskipTests -DskipITs -Ddockerfile.skip -DdockerCompose.skip -Dmaven.deploy.skip=true"
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
