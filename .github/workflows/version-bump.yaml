name: Version bump and tag creation

on:
  push:
    branches:
      - master
    paths:
      - 'backend/service/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version-bump-and-tag:
    runs-on: ubuntu-latest
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[ci skip]')"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'backend/service/pom.xml'

      - name: Configure Git and SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$SSH_KEY" ]; then
            mkdir -p ~/.ssh
            echo "$SSH_KEY" | base64 -d > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts
            git remote set-url origin git@github.com:${{ github.repository }}.git
          fi

      - name: Release and Bump Version
        working-directory: backend/service
        run: |
          # 1. Read current snapshot version from pom.xml
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Current project version: $CURRENT_VERSION"

          RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
          echo "Release version to tag: $RELEASE_VERSION"

          # 2. Set release version in pom.xml and tag
          mvn versions:set -DnewVersion=${RELEASE_VERSION} -DgenerateBackupPoms=false
          git add pom.xml
          git commit -m "chore(release): prepare release ${RELEASE_VERSION} [ci skip]"
          git tag -a "${RELEASE_VERSION}" -m "Release ${RELEASE_VERSION}"

          # 3. Calculate next snapshot version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$RELEASE_VERSION"
          NEXT_PATCH=$((PATCH + 1))
          NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-SNAPSHOT"
          echo "Next development version: $NEXT_VERSION"

          mvn versions:set -DnewVersion=${NEXT_VERSION} -DgenerateBackupPoms=false
          git add pom.xml
          git commit -m "chore(release): prepare for next development iteration ${NEXT_VERSION} [ci skip]"

          # 4. Push commit and release tag
          git push origin master
          git push origin "${RELEASE_VERSION}"
