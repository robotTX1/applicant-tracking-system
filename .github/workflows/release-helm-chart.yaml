name: Release Helm Chart

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or version to release (e.g. 1.0.0 or v1.0.0). Defaults to current ref.'
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release-helm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Parse release version from tag
        id: version
        run: |
          RAW_TAG="${{ inputs.tag || github.ref_name }}"
          # Strip potential prefixes like 'v' or 'applicant-tracking-system-'
          VERSION=$(echo "$RAW_TAG" | sed -E 's/^([a-zA-Z-]+-)?v?//')
          CHART_NAME=$(helm show chart backend/deployment/helm-chart | grep '^name:' | awk '{print $2}')

          echo "Raw tag: $RAW_TAG"
          echo "Parsed chart version: $VERSION"
          echo "Chart name: $CHART_NAME"

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "name=${CHART_NAME}" >> $GITHUB_OUTPUT
          echo "tag=${RAW_TAG}" >> $GITHUB_OUTPUT

      - name: Package Helm chart
        run: |
          mkdir -p dist
          helm package backend/deployment/helm-chart \
            --version ${{ steps.version.outputs.version }} \
            --app-version ${{ steps.version.outputs.version }} \
            --destination dist

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          CHART_NAME="${{ steps.version.outputs.name }}"
          PACKAGE="dist/${CHART_NAME}-${VERSION}.tgz"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG exists. Uploading Helm package..."
            gh release upload "$TAG" "$PACKAGE" --clobber
          else
            echo "Creating GitHub Release $TAG with Helm package..."
            gh release create "$TAG" "$PACKAGE" \
              --title "Release ${TAG}" \
              --notes "Release ${TAG} including Helm chart artifact."
          fi

      - name: Push to GitHub Container Registry (OCI)
        env:
          HELM_EXPERIMENTAL_OCI: 1
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm push dist/*.tgz "oci://ghcr.io/${OWNER_LOWER}/charts"
