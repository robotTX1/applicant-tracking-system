name: Helm Chart Checks

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'backend/deployment/helm-chart/**'
      - '.github/workflows/helm-pr-checks.yaml'
  push:
    branches: [ master ]
    paths:
      - 'backend/deployment/helm-chart/**'
      - '.github/workflows/helm-pr-checks.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Lint Helm chart
        run: helm lint backend/deployment/helm-chart

      - name: Template Helm chart (dry-run render)
        run: helm template test-release backend/deployment/helm-chart

      - name: Package Helm chart (verify package)
        run: |
          mkdir -p dist
          helm package backend/deployment/helm-chart --destination dist
